server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # React Router client-side routes must fall back to index.html.
    # API requests are sent directly to the host-published FastAPI port
    # (VITE_API_BASE_URL=http://localhost:8000), avoiding route collisions
    # between /scans/new in React and /scans/{scan_id} in FastAPI.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
