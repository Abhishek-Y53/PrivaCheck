name: Render Demo CI

on:
  push:
    branches: [deploy/render-demo]
  pull_request:
    branches: [deploy/render-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build hosted frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_USE_MOCK_DATA: 'false'
        run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Syntax check
        run: python -m compileall -q backend alembic deploy/smoke_render_routes.py
      - name: Build a minimal test SPA
        run: |
          mkdir -p frontend_dist/assets
          echo '<!DOCTYPE html><html><body>PrivaCheck SPA smoke test</body></html>' > frontend_dist/index.html
      - name: Hosted and local route smoke tests
        run: python deploy/smoke_render_routes.py
